<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloworld</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: -16px;
    }

    .env-card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px 20px;
    }

    .env-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #334155;
    }

    .env-row:last-child {
      border-bottom: none;
    }

    .env-key {
      color: #94a3b8;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
    }

    .env-value {
      color: #f1f5f9;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: right;
      word-break: break-all;
    }

    .env-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .env-badge.development { background: #065f46; color: #6ee7b7; }
    .env-badge.staging     { background: #78350f; color: #fcd34d; }
    .env-badge.production  { background: #7f1d1d; color: #fca5a5; }
    .env-badge.unknown     { background: #334155; color: #cbd5e1; }

    .loading {
      width: 100%;
      max-width: 420px;
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Halloworld</h1>
  <p class="subtitle">Dijalankan dengan Express</p>
  <p>Versi 1</p>

  <div id="env-card" class="env-card">
    <div class="loading">Memuat konfigurasi…</div>
  </div>

  <script>
    function createRow(key, valueNode) {
      const row = document.createElement('div');
      row.className = 'env-row';

      const keyEl = document.createElement('span');
      keyEl.className = 'env-key';
      keyEl.textContent = key;

      const valueEl = document.createElement('span');
      valueEl.className = 'env-value';
      valueEl.appendChild(valueNode);

      row.append(keyEl, valueEl);
      return row;
    }

    function textNode(text) {
      return document.createTextNode(text);
    }

    function badgeNode(env) {
      const known = ['development', 'staging', 'production'];
      const value = String(env || '').toLowerCase();
      const badge = document.createElement('span');
      badge.className = 'env-badge ' + (known.includes(value) ? value : 'unknown');
      badge.textContent = env || 'tidak diset';
      return badge;
    }

    async function loadEnv() {
      const card = document.getElementById('env-card');

      try {
        const response = await fetch('/api/info');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();

        card.replaceChildren(
          createRow('APP_NAME', textNode(data.appName)),
          createRow('APP_ENV', badgeNode(data.appEnv)),
          createRow('PORT', textNode(String(data.port))),
          createRow('NODE_VERSION', textNode(data.nodeVersion))
        );
      } catch (error) {
        card.replaceChildren(
          createRow('ERROR', textNode('Gagal memuat konfigurasi: ' + error.message))
        );
      }
    }

    loadEnv();
  </script>
</body>
</html>
