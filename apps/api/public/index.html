<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloworld</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: -16px;
    }

    .env-card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px 20px;
    }

    .env-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #334155;
    }

    .env-row:last-child {
      border-bottom: none;
    }

    .env-key {
      color: #94a3b8;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
    }

    .env-value {
      color: #f1f5f9;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: right;
      word-break: break-all;
    }

    .env-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .env-badge.development { background: #065f46; color: #6ee7b7; }
    .env-badge.staging     { background: #78350f; color: #fcd34d; }
    .env-badge.production  { background: #7f1d1d; color: #fca5a5; }
    .env-badge.unknown     { background: #334155; color: #cbd5e1; }

    .loading {
      width: 100%;
      max-width: 420px;
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      padding: 20px 0;
    }

    .log-button {
      appearance: none;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .log-button:hover {
      background: #273549;
      border-color: #475569;
    }

    .log-button:active {
      transform: translateY(1px);
    }

    .log-button:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    .log-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .hint {
      color: #64748b;
      font-size: 0.82rem;
      text-align: center;
      max-width: 420px;
    }

    .hint code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      color: #94a3b8;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #065f46;
      color: #d1fae5;
      border: 1px solid #047857;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: #7f1d1d;
      color: #fecaca;
      border-color: #b91c1c;
    }
  </style>
</head>
<body>
  <h1>Halloworld</h1>
  <p class="subtitle">Dijalankan dengan Express</p>
  <p>Versi 1</p>

  <div id="env-card" class="env-card">
    <div class="loading">Memuat konfigurasi…</div>
  </div>

  <button id="log-toggle" class="log-button" type="button">
    Tekan untuk Log
  </button>

  <p class="hint">
    Log muncul di <strong>terminal</strong> tempat <code>npm start</code> berjalan.
  </p>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    function createRow(key, valueNode) {
      const row = document.createElement('div');
      row.className = 'env-row';

      const keyEl = document.createElement('span');
      keyEl.className = 'env-key';
      keyEl.textContent = key;

      const valueEl = document.createElement('span');
      valueEl.className = 'env-value';
      valueEl.appendChild(valueNode);

      row.append(keyEl, valueEl);
      return row;
    }

    function textNode(text) {
      return document.createTextNode(text);
    }

    function badgeNode(env) {
      const known = ['development', 'staging', 'production'];
      const value = String(env || '').toLowerCase();
      const badge = document.createElement('span');
      badge.className = 'env-badge ' + (known.includes(value) ? value : 'unknown');
      badge.textContent = env || 'tidak diset';
      return badge;
    }

    async function loadEnv() {
      const card = document.getElementById('env-card');

      try {
        const response = await fetch('/api/info');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();

        card.replaceChildren(
          createRow('APP_NAME', textNode(data.appName)),
          createRow('APP_ENV', badgeNode(data.appEnv)),
          createRow('PORT', textNode(String(data.port))),
          createRow('NODE_VERSION', textNode(data.nodeVersion))
        );
      } catch (error) {
        card.replaceChildren(
          createRow('ERROR', textNode('Gagal memuat konfigurasi: ' + error.message))
        );
      }
    }

    const toast = document.getElementById('toast');
    let toastTimer = null;

    function showToast(message, isError) {
      toast.textContent = message;
      toast.classList.toggle('error', Boolean(isError));
      toast.classList.add('show');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    const logToggle = document.getElementById('log-toggle');
    let clickCount = 0;

    logToggle.addEventListener('click', async () => {
      clickCount += 1;
      logToggle.disabled = true;

      try {
        const response = await fetch('/api/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ asal: 'tombol-halaman', jumlah: clickCount }),
        });

        if (!response.ok) throw new Error('HTTP ' + response.status);

        showToast('Tercatat di terminal ✓');
      } catch (error) {
        showToast('Gagal: ' + error.message, true);
      } finally {
        logToggle.disabled = false;
      }
    });

    loadEnv();
  </script>
</body>
</html>
